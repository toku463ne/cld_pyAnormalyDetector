##################################################
#  Logging
##################################################
logging:
  enabled: false
  level: INFO
  format: "%(asctime)s - %(levelname)s - %(message)s"
  log_dir: "{{ HOME }}/anomdec/logs"
  file: "anomdec.log"

##################################################
#  run locks
##################################################
#  Each entry point (anomdec-detect / -detect-fast / -update-stats) takes an
#  exclusive flock here, so a cron run and an on-demand manual run of the same
#  command can never overlap.  A blocked run exits 75 (EX_TEMPFAIL) without
#  doing any work; pass --wait SECS to queue behind the running one instead.
#  Single host only -- flock does not coordinate across machines.
lock_dir: "/tmp/anomdec/locks"

##################################################
#  admdb
##################################################
admdb:
  host: "{{ ADM_DB_HOST | default('localhost') }}"
  port: 5432
  user: anomdec
  password: "{{ ADM_DB_PASSWORD | default('') }}"
  dbname: anomdec
  schema: public

##################################################
#  data collection params (cascaded to data_sources)
##################################################
batch_size: 100
# history_interval sizes the recent window (retention x interval = how far back
# to fetch) and is the *fallback* sample spacing.  It is not a promise about how
# often an item is really collected: anything that converts a sample count into
# seconds measures each item's own median clock gap and uses that instead, so a
# Zabbix polling at 60s under the default 600 no longer reports 10x the duration
# it actually saw (features/baseline.py::sample_interval).
history_interval: 600        # seconds per history record
history_retention: 18        # keep last N history records (~3h)
trends_retention: 14         # days of trends to retain for stats
# Trends rows are hourly aggregates, so trends_stats.std only measures how much
# the hourly *average* moves — for a metric that idles most of the hour and
# bursts for a few minutes it is 8-30x smaller than the spread of the raw
# samples the changepoint detector and the duration gate compare against.
# intra_std = mean(value_max - value_min) / trends_range_to_sigma recovers the
# missing within-hour component, and consumers use hypot(std, intra_std).
# The divisor is the range rule's d2 constant: 2.53 at 6 samples/hour, 3.26 at
# 12, 4.64 at 60.  4.0 is a mid-range compromise — raise it to suppress more,
# lower it to detect more.
trends_range_to_sigma: 4.0
anomaly_keep_secs: 86400     # keep anomalies for 1 day
# An item whose newest history sample is older than this has stopped reporting;
# its window stats no longer describe anything, so scoring it just produces a
# saturated score every hour.  Skip it instead.  0 disables the check.
staleness_secs: 3600

##################################################
#  detectors (cascaded to data_sources)
##################################################
detectors:
  zscore:
    enabled: true
    weight: 0.3
    lambda_threshold: 3.0
    min_ignore_rate: 0.05    # ignore if |h_mean - t_mean| / t_mean < this
  changepoint:
    enabled: true
    weight: 0.3
    # Thresholds are in units of hypot(trends_stats.std, intra_std) — the sigma
    # of a single raw sample — and the accumulator integrates over time, so the
    # statistic no longer scales with how often the item happens to be polled.
    cusum_h: 5.0             # decision threshold (in units of sigma)
    cusum_k: 0.5             # slack (in units of sigma); must exceed the typical
                             # per-sample deviation or the CUSUM drifts upward
                             # under H0 and turns into a sample counter
  seasonal:
    enabled: true
    weight: 0.4
    lambda_threshold: 3.0

ensemble:
  min_score: 0.7            # precision-first; raise toward 0.8 to suppress more
  require_any: 2            # >=2 detectors must agree (cascade-like; cuts single-signal noise)

##################################################
#  clustering (cascaded to data_sources)
##################################################
clustering:
  jaccard_eps: 0.1
  corr_eps: 0.10   # correlate first-diffs on the history window only; 0.2 merged everything that co-spiked
  raw_corr_min: 0.99   # raw-level channel: recover same-family monotonic ramps the diff channel fragments
  min_samples: 2
  sigma: 2.0                 # trends sample is "outside baseline" beyond mean ± sigma*std
  detection_period: 43200    # seconds of history used for clustering
  # Onset constraint: same incident => anomalies started at the same time.
  # Correlation alone cannot see onset timing — within a 12h window a ramp that
  # began a week ago and a step from yesterday are both just gentle drift, so
  # unrelated items merge (e.g. free-disk-space on different hosts).  Onsets are
  # derived from trends (hourly), so resolution is ~1h.  0 disables.
  max_onset_gap: 7200        # 2h: items whose anomalies began further apart never share a cluster
  onset_level_tol: 0.1       # +/-10% of the current value still counts as "the same level"
  onset_tolerance: 2         # consecutive out-of-band trends samples tolerated inside a regime
  onset_recent_samples: 3    # trailing trends samples whose median defines the current level

##################################################
#  metric categories (cascaded to data_sources)
##################################################
#  Per-metric-type weighting + magnitude/duration gating.
#  An item is matched to the first category whose key_patterns (fnmatch globs
#  on items.key_ / item_name) match.  The final decision is:
#
#    effective_score = ensemble_score × weight × magnitude_scale × duration_scale
#    is_anomaly      = effective_score >= ensemble.min_score
#
#  - weight           : prior importance of the metric type (generalises to new data)
#  - magnitude.*      : scales by Δ = |recent_mean - trend_mean| (change from baseline)
#  - duration (global): scales by how long the item stayed anomalous in-window
#
#  Thresholds below are PLACEHOLDERS — tune via evaluation.backtester's
#  per-category report.  Categories are kept unit-coherent (items.csv has no
#  units column, so absolute thresholds only make sense within one metric type).
metric_categories:
  default_weight: 1.0
  duration:
    enabled: true
    measure: count            # count = total anomalous samples; consecutive = longest run
    sigma: 2.0                # sample is "anomalous" outside trend_mean ± sigma·trend_std
    lo_secs: 600             # ≤ this anomalous time (one 10-min spike) → suppressed
    hi_secs: 3600            # ≥ this (sustained ≥ 1h) → full weight
    floor: 0.0
  idle_baseline:
    # Metrics that read zero whenever their resource is idle (VMware guest disk
    # latency, outstanding-IO depth, rarely-used counters) have a baseline mean
    # near zero, so any activity is a relative change of tens or hundreds and no
    # relative threshold can discriminate.  When the baseline is zero more than
    # max_zero_ratio of the window, require the recent level to be
    # *unprecedented* — above the highest value in the whole baseline window.
    # A normally-zero error counter spiking off the scale still fires; routine
    # idle→busy transitions do not.
    enabled: true
    max_zero_ratio: 0.8
    floor: 0.0
  recurring_peak:
    # Some metrics peak as a matter of course — a call counter that climbs every
    # business morning, a VM whose CPU spikes on every batch job.  When one is
    # flagged, the level it reached is one it has reached many times before, and
    # a reviewer rejects it on sight.
    #
    # The old implementation's detect3 vetoed any item whose level was not
    # unprecedented.  Applied unconditionally that is far too blunt: measured
    # against the 19 human-labelled queues it removed 25 of 36 confirmed
    # anomalies, because a real anomaly is usually not an unprecedented *level* —
    # it is a normal level at an abnormal time.
    #
    # What makes it safe is `min_episodes`, a precondition on the baseline's
    # SHAPE that never looks at the current level: only items that peak
    # habitually are eligible.  On those same labels the confirmed anomalies sit
    # at a median of 0 episodes and a maximum of 8 (34 of 36 are at 0 or 1),
    # while the habitual peakers reviewers rejected run 9-72 — so the veto lands
    # on one group and not the other.  At min_episodes 9: TP 36 -> 36, no recall
    # cost at all, and the rejected cycle goes 12 -> 7.
    #
    # Needs `local_peak` / `peak_episodes` from the daily batch; fails open until
    # anomdec-update-stats has run once.  Upward excursions only — a collapse is
    # always below local_peak, and vetoing those would mute "the service stopped".
    #
    # exclude_recent_secs keeps the tail of the baseline out of the precedent: an
    # excursion still in progress would otherwise raise local_peak to cover
    # itself and clear its own veto.  One day = the daily batch cadence.
    enabled: true
    min_episodes: 9           # baseline excursions that make an item a habitual peaker
    k_sigma: 2.0              # sigma multiple a bucket max must clear to open an episode
    exclude_recent_secs: 86400
    floor: 0.0
  categories:
    # --- container / packet / session metrics: small or non-byte units, so an
    #     absolute byte/percent floor is wrong.  Driven by RELATIVE Δ instead, so
    #     a collapse to zero (delta/baseline ≈ 1.0) always scores full magnitude.
    #     Listed BEFORE the byte-based `network`/`cpu` rules so they win.
    - name: container_cpu    # docker cpu_usage rate is a small fraction, not %-points
      key_patterns: ["docker.container_stats.cpu_usage.*"]
      weight: 1.0
      magnitude: {mode: relative, lo: 0.3, hi: 1.0}
    - name: packets          # packet counts/rates, not bytes
      key_patterns: ["docker.networks.*packets*", "net.if.*packets*", "vmware.vm.net.*packets*"]
      weight: 0.6
      magnitude: {mode: relative, lo: 0.3, hi: 1.0}
    - name: session_traffic  # connection-tracking traffic; units vary by device
      key_patterns: ["*session*traffic*"]
      weight: 0.6
      magnitude: {mode: relative, lo: 0.3, hi: 1.0}
    - name: network          # bytes/sec — absolute Δ floor (steady high host → Δ≈0 → ignored)
      key_patterns: ["net.if.*", "vmware.vm.net.*", "vmware.hv.network.*", "docker.networks.*"]
      weight: 0.2
      magnitude: {mode: absolute, lo: 1048576, hi: 10485760}   # 1 MB → 10 MB
    - name: cpu_load         # load average — absolute Δ in load units (unbounded, ~scales with cores)
      key_patterns: ["system.cpu.load*"]
      weight: 1.0
      magnitude: {mode: absolute, lo: 1, hi: 4}
    # vmware.vm.cpu.usage is reported in **Hz** (1e8-1e9), not percent, so an
    # absolute lo/hi in percentage points saturates on every item.  Only the
    # `.perf` variant is a percentage.  Order matters: `.perf` must win.
    - name: cpu_perf         # vmware guest CPU as a percentage
      key_patterns: ["vmware.vm.cpu.usage.perf*"]
      weight: 1.0
      magnitude: {mode: absolute, lo: 10, hi: 40}
    - name: cpu_hz           # vmware guest CPU in Hz — relative Δ
      key_patterns: ["vmware.vm.cpu.*"]
      weight: 1.0
      magnitude: {mode: relative, lo: 0.5, hi: 1.5}
    - name: cpu              # percent — absolute Δ in percentage points
      key_patterns: ["system.cpu.util*"]
      weight: 1.0
      magnitude: {mode: absolute, lo: 10, hi: 40}
    - name: memory_pct       # percent — absolute Δ in percentage points
      key_patterns: ["vm.memory.util*", "vm.memory.pusage*", "*.pusage*"]
      weight: 0.7
      magnitude: {mode: absolute, lo: 5, hi: 30}
    - name: memory_bytes     # bytes — relative Δ (absolute level varies by host)
      key_patterns: ["vm.memory.size*", "vm.memory.free*", "vm.memory.used*", "vm.memory.buffers*", "proc.mem*", "docker.container_stats.memory.usage*"]
      weight: 0.7
      magnitude: {mode: relative, lo: 0.1, hi: 0.5}
    # Disk/storage IO.  The vmware.* patterns are spelled out because fnmatch
    # anchors at the start: `vfs.dev.*` does NOT match
    # `vmware.vm.vfs.dev.write[...]`, so those keys used to fall through to the
    # catch-all and be driven by relative Δ against a near-zero baseline.
    - name: disk             # bytes/ops — relative Δ
      key_patterns: ["vfs.fs.*", "vfs.dev.*", "truenas.dataset.*", "truenas.zpool.*",
                     "vmware.vm.vfs.dev.*", "vmware.vm.storage.*", "vmware.hv.datastore.*"]
      weight: 0.5
      magnitude: {mode: relative, lo: 0.05, hi: 0.3}
    # Catch-all: global relative-change floor for every uncategorised metric
    # (mssql/mysql/vmware/system counters, etc.) == the old ignore_diff_rate.
    # Must be LAST so specific categories win. Raise lo/hi to suppress more.
    - name: default          # relative Δ floor (recent vs trend); ignore small changes
      key_patterns: ["*"]
      weight: 1.0
      magnitude: {mode: relative, lo: 0.5, hi: 1.0}

##################################################
#  item / anomaly filters (cascaded to data_sources)
##################################################
#  Matched by items.key_ (fnmatch glob) AND items.units (exact); empty = match all.
#  - item_filters    drop items BEFORE detectors run (== old item_conds)
#  - anomaly_filters drop scored anomalies whose |recent-trend| change is below an
#                    operationally meaningful amount (== old item_diff_conds)
#  Ported from org/pyAnomalyDetector/samples/zabbix_psql.yml. NOTE: SQL-LIKE
#  brackets (net.if.x[y], web.test.time[z]) become a trailing * here because
#  fnmatch treats [..] as a character class.

item_filters:
  - name: ignore-uptime
    key_pattern: "*uptime*"
  - name: ignore-localtime
    key_pattern: "system.localtime"
  - name: ignore-low-traffic         # only flag interface traffic above 8 Mbps
    key_pattern: "net.if.*"
    units: "bps"
    min_value: 8000000

anomaly_filters:
  - name: cpu-pct-noise              # CPU % change must exceed 8 points
    key_pattern: "*cpu.*"
    units: "%"
    min_abs_diff: 8
  - name: mem-pct-noise
    key_pattern: "*mem.*"
    units: "%"
    min_abs_diff: 8
  - name: fs-size-pct-noise
    key_pattern: "*vfs.fs.size*"
    units: "%"
    min_abs_diff: 3
  - name: fs-size-bytes-noise        # only flag disk moves >= 1 GB
    key_pattern: "*vfs.fs.size*"
    units: "B"
    min_abs_diff: 1000000000
  - name: fs-inode-pct-noise
    key_pattern: "*vfs.fs.inode*"
    units: "%"
    min_abs_diff: 3
  - name: pused-pct-noise
    key_pattern: "*.pused*"
    units: "%"
    min_abs_diff: 3
  - name: webtest-time-noise
    key_pattern: "web.test.time*"
    units: "s"
    min_abs_diff: 1
  - name: net-traffic-noise          # ignore < 1 Mbps shifts
    key_pattern: "net.if.*"
    units: "bps"
    min_abs_diff: 1000000
  # Low-count / low-rate metrics.  These pass every relative test (going from 1
  # to 3 sshd sessions is +200%) but the absolute move is not worth waking
  # anybody for.  Floors are in the metric's own unit.
  - name: proc-count-noise           # process counts: ignore < 5 processes
    key_pattern: "proc.num*"
    min_abs_diff: 5
  - name: mysql-rate-noise           # mysql per-second rates: ignore < 1/s
    key_pattern: "mysql.com_*"
    min_abs_diff: 1
  - name: unbound-histogram-noise    # per-bucket query counts: ignore < 100 queries
    key_pattern: "unbound.histogram*"
    min_abs_diff: 100
  - name: call-stats-noise           # call counters: ignore < 10 calls
    key_pattern: "call.stats.*"
    min_abs_diff: 10
  - name: mssql-cache-object-noise   # cache object counts: ignore < 10 objects
    key_pattern: "mssql.cache_object*"
    min_abs_diff: 10
  - name: pct-noise-catchall         # any percent metric: ignore < 3 point change
    units: "%"
    min_abs_diff: 3
  - name: temp-noise                 # ignore < 5 degree changes
    units: "°C"
    min_abs_diff: 5

##################################################
#  fast_detect: high-frequency short-span axis (cascaded to data_sources)
##################################################
#  A second detection axis for a small watchlist: run every 5-10 min via cron
#  (anomdec-detect-fast), score each watched item against a short window, veto
#  levels the seasonal baseline (hour_stats) considers expected (e.g. nightly
#  backup traffic), group co-occurring triggers, and write a JSON event file
#  that Zabbix polls ($.max_score) so a webhook can forward to chat.
#
#  Disabled by default. Uncomment and point `watch` at your critical items.
#
# fast_detect:
#   enabled: true
#   watch:                              # match ANY rule; empty pattern = match-all
#     - key_pattern: "cisco.asav.session.*"
#     - host_pattern: "sbc*"
#   history_span_secs: 3600             # short baseline window (~6 samples @10min)
#   detect_window: 4                    # last N samples form the "recent" mean
#   lambda_threshold: 3.0               # short-window z -> severity
#   min_item_score: 0.5                 # per-item trigger threshold
#   seasonal_veto: true                 # drop levels expected for this hour-of-day
#   seasonal_lambda: 3.0
#   cooccur: true                       # group co-triggers (noisy-OR boosts score)
#   use_zabbix_events: true             # fold severity-weighted Zabbix events into the score
#   events_window_secs: 0               # 0 = reuse history_span_secs
#   events_saturation: 3.0              # sum(severity/5) mapping to ~full host weight
#   min_event_score: 0.5                # host event weight >= this -> standalone alert
#   output_path: "/var/lib/anomdec/fast_events.json"

